{% set name = "tiler" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/tiler-{{ version }}.tar.gz
  sha256: a6cd2e1e0ccf6be6685d7ac1fb481fb95204054366ca6ff29bac42c62c878710
  patches:
    - exclude_tests.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools_scm
    - setuptools_scm_git_archive
  run:
    - numpy
    - python >={{ python_min }}
    - tqdm

test:
  imports:
    - tiler
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/the-lay/tiler
  summary: N-dimensional NumPy array tiling and merging with overlapping, padding and tapering
  dev_url: https://github.com/the-lay/tiler
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - goanpeca
    - the-lay
